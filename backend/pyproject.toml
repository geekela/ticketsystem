[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend that classifies support tickets"
readme = "README.md"
authors = [
    { name = "Elisa D'Errico", email = "94899448+geekela@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "mistralai>=3.6.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
